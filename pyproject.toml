[project]
name = "gpu-optimization-project"
version = "0.1.0"
description = "Standalone reproduction of L4 inference frequency control"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.3",
    "numpy==2.3.1",
    "scikit-learn==1.9.1",
    "scipy==1.16.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
